readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Juan Alberto" },
    { name = "Alejandro García" },
    { name = "Daniel" },
    { name = "Juan Esteban" },
]
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "jupyterlab==4.6.4",
    "ipykernel==7.4.0",
    "nbconvert==7.17.1",
]
